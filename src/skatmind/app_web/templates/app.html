<!doctype html>
<html lang="{{HTML_LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_TITLE}} | {{PRODUCT_NAME}}</title>
  <link rel="stylesheet" href="/assets/app.css">
  {{EXTRA_STYLES}}
</head>
<body>
  <a class="skip-link" href="#main-content">{{SKIP_LINK}}</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="{{BRAND_LABEL}}">{{PRODUCT_NAME}}</a>
    <nav aria-label="{{NAVIGATION_LABEL}}">{{NAVIGATION}}</nav>
    {{LANGUAGE_SELECTOR}}
  </header>
  <main id="main-content" tabindex="-1" data-workflow="{{WORKFLOW}}">
    <h1>{{HEADING}}</h1>
    {{PROFILE_WARNING}}
    {{CONTENT}}
  </main>
  <footer>
    <p>{{FOOTER}}</p>
  </footer>
  {{EXTRA_SCRIPTS}}
</body>
</html>
