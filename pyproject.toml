[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "skatmind"
version = "0.17.0"
description = "Local Skat analysis and simulation tool"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]
dependencies = [
    "jsonschema>=4.23.0",
    "referencing>=0.31.0",
    "tzdata>=2026.4",
]

[project.scripts]
skatmind = "skatmind.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["skatmind*"]

[tool.setuptools.package-data]
skatmind = ["py.typed"]
"skatmind.schema_resources" = ["*.schema.json"]
"skatmind.capture_web" = ["templates/*.html", "assets/*.css", "assets/*.js"]
"skatmind.corpus_web" = ["templates/*.html", "assets/*.css", "assets/*.js"]
"skatmind.app_web" = ["templates/*.html", "assets/*.css", "assets/*.js", "locales/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
